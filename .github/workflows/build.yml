name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4 --distribution-type bin

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK with Wrapper
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/*.apk InstaReelsTracker.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2
          name: "InstaReels Tracker APK v2.2"
          files: InstaReelsTracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
