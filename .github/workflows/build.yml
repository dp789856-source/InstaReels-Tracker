name: Build and Release Signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Sign APK with Keystore (Bypass Play Protect Warning)
        run: |
          keytool -genkey -v -keystore release.keystore -alias trackerkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=InstaTracker, OU=Mobile, O=Apps, L=Hyd, S=TS, C=IN"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass 123456 -keypass 123456 app/build/outputs/apk/debug/*.apk trackerkey
          mkdir -p output
          cp app/build/outputs/apk/debug/*.apk output/InstaReelsTracker.apk

      - name: Publish Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3
          name: "InstaReels Tracker Signed APK v2.3"
          files: output/InstaReelsTracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
