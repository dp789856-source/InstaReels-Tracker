name: Build and Release Valid Signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Build-Tools
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1'

      - name: Build Unsigned APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Align and Sign APK with v2 Scheme (Fix Invalid Package)
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # Keystore generate cheyadam
          keytool -genkey -v -keystore release.keystore -alias trackerkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=InstaTracker, OU=Mobile, O=Apps, L=Hyd, S=AP, C=IN"
          
          # Zipalign process
          $BUILD_TOOLS_DIR/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          
          # Official APK Signature Scheme v2 signing
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias trackerkey --out InstaReelsTracker.apk app-aligned.apk
          
          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify InstaReelsTracker.apk

      - name: Publish Valid APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4
          name: "InstaReels Tracker Valid APK v2.4"
          files: InstaReelsTracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
